[package]
name = "gofetch"
version = "0.1.0"
description = "GoFetch — ambient monitor for Claude Code sessions"
authors = ["GoFetch"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gofetch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is required because tauri.conf.json sets app.macOSPrivateApi
# = true to allow the transparent, frameless widget window on macOS.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
# OS-native notifications (Task 7 / GF-12).
tauri-plugin-notification = "2"
# Launch-at-startup option (Task 13 / GF-18).
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Localhost HTTP receive server for Claude Code hook events (Task 3 / GF-8).
axum = "0.8"
tokio = { version = "1", features = ["net", "time"] }

[dev-dependencies]
# Test/`serve` example only: full async runtime + tower's `oneshot` helper.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
