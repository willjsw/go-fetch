<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoFetch</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="widget" id="app" data-tauri-drag-region>
      <!-- Window controls (WC-6). Children of the drag region, so they stay
           clickable (data-tauri-drag-region only affects the element it's on).
           − hides to tray (restored via tray left-click); × fully quits. -->
      <div class="winctl">
        <button class="winctl-btn min" id="win-min" type="button" title="Hide (tray로 복원)" aria-label="Hide">−</button>
        <button class="winctl-btn close" id="win-close" type="button" title="Quit GoFetch" aria-label="Quit">×</button>
      </div>
      <button class="gear" id="gear" type="button" title="Settings" aria-label="Settings">⚙</button>
      <!-- Empty state (DI-6): shown when no Claude Code session is active. -->
      <section class="empty-state" id="empty-state">
        <div class="char-lg" id="empty-char" aria-hidden="true"></div>
        <p class="empty-title">No active sessions</p>
        <p class="empty-sub">Monitoring for Claude Code…</p>
      </section>

      <!-- Session list (filled by later tasks: state machine + visualization). -->
      <section class="sessions" id="sessions" hidden></section>

      <!-- Custom resize handles (WC-8). A frameless window has no native resize
           grips (Tauri #8519), so edges/corners trigger startResizeDragging.
           Wired in main.js; max size is capped to 1/4 of the screen area. -->
      <div class="rsz n" data-resize="North"></div>
      <div class="rsz s" data-resize="South"></div>
      <div class="rsz e" data-resize="East"></div>
      <div class="rsz w" data-resize="West"></div>
      <div class="rsz ne" data-resize="NorthEast"></div>
      <div class="rsz nw" data-resize="NorthWest"></div>
      <div class="rsz se" data-resize="SouthEast"></div>
      <div class="rsz sw" data-resize="SouthWest"></div>
    </main>
  </body>
</html>
