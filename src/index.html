<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoFetch</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="widget" id="app">
      <!-- Title bar (WC-6): the drag handle + window controls, visually split
           from the content below by a divider so buttons never overlap cards.
           − hides to tray (restored via tray left-click); × fully quits. -->
      <header class="titlebar" data-tauri-drag-region>
        <button class="gear" id="gear" type="button" title="Settings" aria-label="Settings">⚙</button>
        <!-- The title also carries the drag region: `data-tauri-drag-region`
             only applies to the element it's on, and this span fills the bar's
             center, so without it most of the title bar wouldn't be draggable. -->
        <span class="title" data-tauri-drag-region>GoFetch</span>
        <div class="winctl">
          <button class="winctl-btn min" id="win-min" type="button" title="Hide (tray로 복원)" aria-label="Hide">−</button>
          <button class="winctl-btn close" id="win-close" type="button" title="Quit GoFetch" aria-label="Quit">×</button>
        </div>
      </header>

      <!-- Mode tabs (GF-110): switch between the card list and the animated
           character mode. Lives in the fixed chrome (between title bar and the
           scrolling content) so it never scrolls away. -->
      <nav class="mode-tabs" role="tablist" aria-label="View mode">
        <button class="mode-tab active" type="button" role="tab" data-mode="cards" aria-selected="true">Cards</button>
        <button class="mode-tab" type="button" role="tab" data-mode="anim" aria-selected="false">Animated</button>
      </nav>

      <!-- Content area: scrolls independently of the title bar. -->
      <div class="content">
        <!-- Empty state (DI-6): shown when no Claude Code session is active. -->
        <section class="empty-state" id="empty-state">
          <div class="char-lg" id="empty-char" aria-hidden="true"></div>
          <p class="empty-title">No active sessions</p>
          <p class="empty-sub">Monitoring for Claude Code…</p>
        </section>

        <!-- Session list (state machine + visualization). -->
        <section class="sessions" id="sessions" hidden></section>

        <!-- Animated character stage (GF-110 shell; renderer wired in GF-112). -->
        <section class="stage" id="stage" hidden></section>
      </div>

      <!-- Custom resize handles (WC-8). A frameless window has no native resize
           grips (Tauri #8519), so edges/corners trigger startResizeDragging.
           Wired in main.js; max size is capped to 1/4 of the screen area. -->
      <div class="rsz n" data-resize="North"></div>
      <div class="rsz s" data-resize="South"></div>
      <div class="rsz e" data-resize="East"></div>
      <div class="rsz w" data-resize="West"></div>
      <div class="rsz ne" data-resize="NorthEast"></div>
      <div class="rsz nw" data-resize="NorthWest"></div>
      <div class="rsz se" data-resize="SouthEast"></div>
      <div class="rsz sw" data-resize="SouthWest"></div>
    </main>
  </body>
</html>
